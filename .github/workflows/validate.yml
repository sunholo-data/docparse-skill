name: Validate plugin

# Guards against shipping a plugin/marketplace that users can't install.
# This repo broke twice for real users (sunholo-data/ailang-parse#1):
#   - marketplace.json `owner` / plugin.json `author` were strings, not objects
#   - the MCP server was declared inline in plugin.json and never registered
# `claude plugin validate --strict` catches the schema/structure bugs; the
# install smoke test catches the "validates but doesn't actually load" class
# (the inline-mcpServers bug passed validation yet registered 0 servers).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: claude plugin validate --strict + install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Offline schema/structure check. No API key needed.
      - name: Validate manifests (strict)
        run: claude plugin validate --strict .

      # Actually install the plugin from this checkout and assert that both the
      # skill AND the MCP server register. Install needs no API key — MCP tool
      # schemas resolve lazily at runtime, not at install time.
      - name: Install plugin + assert components register
        run: |
          set -euo pipefail
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add ./ --scope user
          claude plugin install ailang-parse@ailang-parse-marketplace --scope user
          DETAILS="$(claude plugin details ailang-parse)"
          echo "$DETAILS"
          echo "$DETAILS" | grep -q "Skills (1)" \
            || { echo "::error::ailang-parse skill did not register"; exit 1; }
          echo "$DETAILS" | grep -q "MCP servers (1)" \
            || { echo "::error::ailang-parse MCP server did not register"; exit 1; }
          echo "✓ skill + MCP server both registered"

  agent-plugins:
    name: Agent Plugins (Codex / ChatGPT) manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No official Agent Plugins validator exists (OpenAI validates only on
      # ZIP upload), so check the published JSON Schemas plus the invariants
      # that keep the Claude and portable manifests from drifting apart.
      - name: Validate plugin.json / mcp.json / marketplace
        run: |
          npm i --no-save ajv@8 ajv-formats@3
          node scripts/validate-agent-plugins.mjs

      # Same "validates but doesn't load" guard as the Claude job: install the
      # plugin through the Codex CLI from this checkout and assert both the
      # plugin and its MCP server register. No auth needed for install.
      - name: Codex install smoke test
        run: |
          set -euo pipefail
          npm install -g @openai/codex
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add ailang-parse@ailang-parse-marketplace
          ls "$CODEX_HOME"/plugins/cache/ailang-parse-marketplace/ailang-parse/*/skills/ailang-parse/SKILL.md \
            || { echo "::error::ailang-parse skill not installed by Codex"; exit 1; }
          MCP="$(codex mcp list)"
          echo "$MCP"
          echo "$MCP" | grep -q "docparse.ailang.sunholo.com/mcp/connect/" \
            || { echo "::error::ailang-parse MCP server did not register in Codex"; exit 1; }
          echo "✓ Codex installed skill + MCP server"
