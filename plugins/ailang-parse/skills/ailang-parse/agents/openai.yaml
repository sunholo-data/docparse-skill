interface:
  display_name: "AILANG Parse (docparse)"
  short_description: "Create, parse, and convert documents with docparse"
  default_prompt: "Use $ailang-parse to create or convert my document with docparse and verify the result."

policy:
  allow_implicit_invocation: true

# Optional hosted backend. The local docparse CLI works without it.
dependencies:
  tools:
    - type: "mcp"
      value: "ailang-parse"
      description: "AILANG Parse hosted MCP server (OAuth sign-in)"
      transport: "streamable_http"
      url: "https://docparse.ailang.sunholo.com/mcp/connect/"
